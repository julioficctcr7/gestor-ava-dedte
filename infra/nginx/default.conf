# =============================================================
# Gestor AVA DEDTE - Nginx HTTPS & Reverse Proxy
# Dominio: gestorava.duckdns.org (Certificado SSL Let's Encrypt Oficial)
# =============================================================

# Redirección automática HTTP a HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name gestorava.duckdns.org localhost 34.176.227.247;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Servidor HTTPS Seguro
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name gestorava.duckdns.org localhost 34.176.227.247;

    # Certificados SSL Let's Encrypt
    ssl_certificate /etc/letsencrypt/live/gestorava.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gestorava.duckdns.org/privkey.pem;

    # Protocolos y Cifrados Criptográficos Robustos (A+ Security)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Optimización de Rendimiento & Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Headers de Seguridad Institucional y HSTS (Candado Verde Garantizado)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 1. Frontend SPA / Dashboard Analítico
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;

        location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2)$ {
            expires 7d;
            add_header Cache-Control "public, no-transform";
        }
    }

    # 2. API Backend CQRS (PHP 8.2-FPM)
    location /api/ {
        root /var/www/backend;
        fastcgi_pass backend:9000;
        fastcgi_index metrics.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/backend$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_read_timeout 60s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # 3. Proxy hacia Moodle LMS y módulos
    location ~ ^/(report|course|mod|lib|theme|pix|message|login|admin)/ {
        proxy_pass http://moodle_uagrm_app:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 90s;
    }

    # 4. Health Check
    location /healthz {
        access_log off;
        return 200 "OK - Gestor AVA DEDTE Online (HTTPS Seguro)\n";
    }
}

