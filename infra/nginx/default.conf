# Configuración Nginx de Alto Rendimiento para Gestor AVA - DEDTE (UAGRM)
# Diseñado para baja latencia (<50ms) y cero bloqueo de base de datos OLTP

server {
    listen 80;
    server_name localhost;

    # Compresión Gzip para máxima velocidad de transferencia
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Headers de seguridad institucional
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Frontend estático SPA / Dashboard Analítico
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
        
        # Cache de assets estáticos en navegador
        location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2)$ {
            expires 7d;
            add_header Cache-Control "public, no-transform";
        }
    }

    # API Backend CQRS (Lectura rápida sin bloqueo)
    location /api/ {
        root /var/www/backend;
        
        # Reescribir /api/... hacia /var/www/backend/...
        fastcgi_pass backend:9000;
        fastcgi_index metrics.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/backend$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        
        # Timeouts optimizados para analítica en tiempo real
        fastcgi_read_timeout 60s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # Health check para el balanceador / Kubernetes / GCP Uptime Check
    location /healthz {
        access_log off;
        return 200 "OK - Gestor AVA DEDTE Online\n";
    }
}
